name: 💡 Une idée · Feature request
description: Quelque chose qu'il devrait savoir faire · Something it should be able to do
labels: [idée]
body:
  - type: textarea
    id: phrase
    attributes:
      label: Ce que tu lui dirais · What you would say to it
      placeholder: « Steve, … »
    validations:
      required: true
  - type: textarea
    id: pourquoi
    attributes:
      label: Ce qu'il devrait faire, et pourquoi · What it should do, and why
